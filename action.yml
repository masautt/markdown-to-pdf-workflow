name: 'Markdown to PDF Workflow'
description: 'Converts all markdown files in ./docs to PDFs and zips them for distribution.'
author: 'YOUR NAME OR ORG'
branding:
  icon: 'file-text'
  color: 'blue'
runs:
  using: 'composite'
  steps:
    - name: Install dependencies
      run: npm ci
      shell: bash
    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium
      shell: bash
    - name: Build PDFs
      run: node scripts/mdpdf/build-pdfs.mjs
      shell: bash
    - name: Zip output
      run: zip -r markdown-pdfs.zip dist-pdfs
      shell: bash
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: markdown-pdfs
        path: markdown-pdfs.zip
